name: CD - Build & Deploy

on:
  workflow_run:
    workflows: ["CI - Code Quality & Validation"]
    types:
      - completed
    branches: ["main"]

jobs:
  # Verify CI passed
  check-ci:
    runs-on: ubuntu-latest
    name: Wait for CI Pipeline
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI Passed
        run: |
          echo "✅ CI Pipeline passed successfully"
          echo "⏳ Proceeding with deployment..."

  # Build and push Docker images
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Docker Images
    needs: check-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Server Image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKER_USER_NAME }}/mern-server:latest
            ${{ secrets.DOCKER_USER_NAME }}/mern-server:${{ github.sha }}

      - name: Build and push Client Image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_USER_NAME }}/mern-client:latest
            ${{ secrets.DOCKER_USER_NAME }}/mern-client:${{ github.sha }}

  # Trigger Render Deployments
  deploy-to-render:
    runs-on: ubuntu-latest
    name: Trigger Render Deployments
    needs: build-and-push
    steps:
      - name: Trigger Render Deploy - Client
        run: |
          echo "🚀 Triggering Render deployment for Client..."
          curl -X POST "https://api.render.com/deploy/srv-d7pthqtckfvc739afrog?key=6H4LxZjAhxE"
          echo "✅ Client deployment triggered"

      - name: Trigger Render Deploy - Server
        run: |
          echo "🚀 Triggering Render deployment for Server..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_SERVER }}"
          echo "✅ Server deployment triggered"

  # Deployment Success
  deploy-success:
    runs-on: ubuntu-latest
    name: Deployment Success
    needs: deploy-to-render
    if: success()
    steps:
      - name: Log Deployment Info
        run: |
          echo "✅ CD Pipeline Completed Successfully!"
          echo ""
          echo "📦 Docker Images Pushed:"
          echo "  - Server: ${{ secrets.DOCKER_USER_NAME }}/mern-server:latest"
          echo "  - Client: ${{ secrets.DOCKER_USER_NAME }}/mern-client:latest"
          echo ""
          echo "🚀 Render deployments triggered for Client & Server"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

  # Deployment Failure
  deploy-failure:
    runs-on: ubuntu-latest
    name: Deployment Failed
    needs: deploy-to-render
    if: failure()
    steps:
      - name: Notify Failure
        run: |
          echo "❌ CD Pipeline Failed"
          echo "Check logs above for details."
          exit 1